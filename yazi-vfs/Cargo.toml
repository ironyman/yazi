[package]
name                   = "yazi-vfs"
description            = "Yazi virtual file system"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
yazi-binding = { path = "../yazi-binding", version = "26.9.1" }
yazi-config  = { path = "../yazi-config", version = "26.9.1" }
yazi-fs      = { path = "../yazi-fs", version = "26.9.1" }
yazi-macro   = { path = "../yazi-macro", version = "26.9.1" }
yazi-runner  = { path = "../yazi-runner", version = "26.9.1" }
yazi-sftp    = { path = "../yazi-sftp", version = "26.9.1" }
yazi-shared  = { path = "../yazi-shared", version = "26.9.1" }
yazi-shim    = { path = "../yazi-shim", version = "26.9.1" }

# External dependencies
bzip2       = "0.6.1"
chrono      = { workspace = true }
deadpool    = { version = "0.13.1", default-features = false, features = [ "managed", "rt_tokio_1" ] }
either      = { workspace = true }
flate2      = { version = "1.1.10", default-features = false, features = [ "zlib-rs" ] }
futures     = { workspace = true }
hashbrown   = { workspace = true }
inventory   = { workspace = true }
lz4_flex    = "0.14.0"
lzma-rust2  = "0.16.5"
mlua        = { workspace = true }
parking_lot = { workspace = true }
ruzstd      = "0.9.0"
russh       = { workspace = true }
tar         = "0.4.46"
tokio       = { workspace = true }
typed-path  = { workspace = true }
zesven      = { version = "3.2.0", default-features = false, features = [ "aes", "bzip2", "deflate", "lzma", "lzma2", "ppmd" ] }
zip         = { version = "8.6.0", default-features = false, features = [ "aes-crypto", "bzip2", "deflate-flate2-zlib-rs", "deflate64", "lzma", "ppmd", "xz" ] }
